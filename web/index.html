<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文享内江｜文化馆课程</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><span class="eyebrow">演示数据 · 文享内江</span><h1>文化馆课程服务</h1><p class="muted">让每个人都能轻松找到喜欢的文化课程</p></div><div class="top-actions"><button id="fontBtn" class="secondary">大字模式</button><button id="adminBtn" class="secondary">管理员</button></div></header><main><section id="resident"><div class="hero"><div><h2>今天想学点什么？</h2><p>可以输入一句话，也可以直接浏览课程。</p><div class="search"><input id="query" placeholder="例如：周末想学安静的传统文化"><button id="searchBtn">智能找课</button></div><div class="mode" id="modeText">当前为规则推荐模式，结果可解释、可回退。</div></div><div class="hero-art">文<br>享</div></div><div class="toolbar"><h2>课程列表</h2><select id="category"><option value="">全部类别</option><option>传统艺术</option><option>音乐</option><option>地方文化</option><option>健康文化</option><option>文化教育</option><option>数字文化</option></select><button class="secondary" id="speakBtn">朗读课程列表</button></div><div id="recommend" class="recommend hidden"></div><div id="courses" class="grid"></div><section><h2>我的课程</h2><div id="schedule" class="schedule"></div></section></section><section id="admin" class="hidden"><div class="toolbar"><div><span class="eyebrow">管理后台</span><h2>课程与报名管理</h2></div><button class="secondary" id="residentBtn">返回居民端</button></div><div class="admin-card"><h3>新增演示课程</h3><form id="courseForm"><input name="title" placeholder="课程名称" required><input name="category" placeholder="类别" required><input name="teacher" placeholder="教师" required><input name="location" placeholder="地点" required><select name="level"><option>初级</option><option>进阶</option></select><input name="audience" placeholder="适合人群" value="居民"><input name="capacity" type="number" placeholder="名额" value="10"><input name="startAt" type="datetime-local" required><input name="endAt" type="datetime-local" required><input name="openAt" type="datetime-local" required><input name="closeAt" type="datetime-local" required><textarea name="description" placeholder="课程说明" required></textarea><button>发布课程</button></form></div><div class="admin-card"><div class="toolbar"><h3>已发布课程</h3><a class="button secondary" href="/api/admin/export">导出报名名单</a></div><div class="import-row"><label>导入课程 CSV <input id="csvFile" type="file" accept=".csv,text/csv"></label><button class="secondary" id="importBtn">导入</button><span class="muted">字段：title,category,description,teacher,location,level,audience,capacity,startAt,endAt</span></div><div id="adminCourses"></div></div></section></main><footer>原型演示，不代表内江市文化馆官方报名入口</footer><script src="/app.js"></script></body></html>
